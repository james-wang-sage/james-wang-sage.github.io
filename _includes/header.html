<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header magazine-header">
  <div class="wrapper masthead">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} home">
      <span class="brand-mark" aria-hidden="true">JW</span>
      <span class="brand-copy">
        <span class="brand-name">{{ site.title | escape }}</span>
        <span class="brand-description">Engineering notes</span>
      </span>
    </a>
    <nav class="editorial-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.layout == 'home' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a class="nav-rss" href="{{ '/feed.xml' | relative_url }}">RSS <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
